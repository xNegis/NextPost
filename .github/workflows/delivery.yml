name: NextPost delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this main revision after CI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nextpost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nextpost_test
          POSTGRES_USER: nextpost
          POSTGRES_PASSWORD: nextpost-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextpost -d nextpost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nextpost:nextpost-ci-only@localhost:5432/nextpost_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and locked-compatible development dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Backend quality and tests
        working-directory: backend
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests
          python -m mypy app
          python -m pytest
      - name: Migration smoke
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend quality, tests and builds
        working-directory: frontend
        run: |
          npm test
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build
          npm run build:mobile
          npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_DB: nextpost_ci
      POSTGRES_USER: nextpost_ci
      POSTGRES_PASSWORD: nextpost-ci-only
      DATABASE_URL: postgresql+psycopg://nextpost_ci:nextpost-ci-only@postgres:5432/nextpost_ci
      SESSION_SECRET: ci-only-session-secret-at-least-thirty-two-characters
      PRIVATE_LINK_SECRET: ci-only-private-link-secret-at-least-thirty-two-characters
      REMOVAL_OPERATOR_ID: ci
      S3_REGION: eu-west-1
      S3_BUCKET: nextpost-ci-placeholder
      S3_PREFLIGHT_APPROVED: "true"
      AWS_ACCESS_KEY_ID: nextpost-ci-placeholder
      AWS_SECRET_ACCESS_KEY: nextpost-ci-placeholder
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate development and production Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.production.yml config --quiet
      - name: Build production images
        run: docker compose -f compose.production.yml build backend frontend

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || inputs.deploy == true)
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: nextpost-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin production host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy exact revision
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: >-
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST"
          "cd /opt/nextpost && DEPLOY_SHA='${{ github.sha }}' ./scripts/deploy.sh"
      - name: Notify the private operator inbox on failure
        if: failure()
        env:
          OPERATOR_ALERT_WEBHOOK_URL: ${{ secrets.OPERATOR_ALERT_WEBHOOK_URL }}
        run: >-
          python scripts/notify_operator.py --event deploy-failed
          --summary "NextPost production deployment failed for ${{ github.sha }}"
