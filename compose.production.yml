name: nextpost

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    labels:
      com.nextpost.revision: ${DEPLOY_SHA:?set DEPLOY_SHA}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CORS_ORIGINS: https://nextpost.formcadence.app
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      PRIVATE_LINK_SECRET: ${PRIVATE_LINK_SECRET:?set PRIVATE_LINK_SECRET}
      REMOVAL_OPERATOR_ID: ${REMOVAL_OPERATOR_ID:?set REMOVAL_OPERATOR_ID}
      PHOTO_STORAGE_ROOT: /app/data/photos
      PHOTO_STORAGE_BACKEND: s3
      S3_REGION: ${S3_REGION:?set S3_REGION}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_PREFIX: nextpost
      S3_PREFLIGHT_APPROVED: ${S3_PREFLIGHT_APPROVED:?set S3_PREFLIGHT_APPROVED}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
      PHOTO_DELETION_ALERT_SECONDS: ${PHOTO_DELETION_ALERT_SECONDS:-86400}
      NEXTPOST_RUN_MAINTENANCE: "1"
    ports:
      - "127.0.0.1:${NEXTPOST_BACKEND_PORT:-8180}:8000"
    tmpfs:
      - /app/data/photos/tmp:mode=0700
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      private:
      proxy:
        aliases: [nextpost-backend]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    labels:
      com.nextpost.revision: ${DEPLOY_SHA:?set DEPLOY_SHA}
    ports:
      - "127.0.0.1:${NEXTPOST_FRONTEND_PORT:-4180}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      proxy:
        aliases: [nextpost-frontend]

networks:
  private:
    internal: true
  proxy:
    external: true
    name: nextpost-proxy

volumes:
  postgres_data:
