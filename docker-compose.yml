services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextpost}
      POSTGRES_USER: ${POSTGRES_USER:-nextpost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextpost-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nextpost:nextpost-local-only@db:5432/nextpost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      SESSION_SECRET: ${SESSION_SECRET:-nextpost-session-secret-local-only}
      PRIVATE_LINK_SECRET: ${PRIVATE_LINK_SECRET:-}
      PHOTO_STORAGE_ROOT: ${PHOTO_STORAGE_ROOT:-data/photos}
      CONSULTATION_MIN_PHOTOS: ${CONSULTATION_MIN_PHOTOS:-2}
      CONSULTATION_MAX_PHOTOS: ${CONSULTATION_MAX_PHOTOS:-10}
      MAX_OPEN_CONSULTATIONS: ${MAX_OPEN_CONSULTATIONS:-3}
      PHOTO_MAX_INPUT_BYTES: ${PHOTO_MAX_INPUT_BYTES:-15728640}
      PHOTO_MAX_PIXELS: ${PHOTO_MAX_PIXELS:-40000000}
      PHOTO_MAX_OUTPUT_EDGE: ${PHOTO_MAX_OUTPUT_EDGE:-2560}
      PHOTO_LEASE_SECONDS: ${PHOTO_LEASE_SECONDS:-86400}
      PHOTO_CLEANUP_INTERVAL_SECONDS: ${PHOTO_CLEANUP_INTERVAL_SECONDS:-3600}
      PHOTO_DELETION_ALERT_SECONDS: ${PHOTO_DELETION_ALERT_SECONDS:-86400}
      CONSULTATION_QUESTION_MAX_LENGTH: ${CONSULTATION_QUESTION_MAX_LENGTH:-120}
      CONSULTATION_CONTEXT_MAX_LENGTH: ${CONSULTATION_CONTEXT_MAX_LENGTH:-500}
    ports:
      - "8000:8000"
    volumes:
      - photo_storage:/app/data
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "4173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  photo_storage:
