# Disposable RF-12 verification only; combine with root docker-compose.yml and
# project name nextpost-rf12-review-20261015. Never target ordinary user volumes.
services:
  db:
    ports: !override
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: rf12_review
      POSTGRES_USER: rf12
      POSTGRES_PASSWORD: rf12-disposable-local
  backend:
    ports: !override
      - "127.0.0.1:18000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://rf12:rf12-disposable-local@db:5432/rf12_review
      CORS_ORIGINS: http://localhost:14173
      SESSION_SECRET: rf12-disposable-local-session-secret
      PRIVATE_LINK_SECRET: rf12-disposable-local-private-link-secret
      PHOTO_STORAGE_ROOT: /app/data/photos
  frontend:
    ports: !override
      - "127.0.0.1:14173:80"
    build:
      args:
        VITE_API_BASE_URL: http://localhost:18000
