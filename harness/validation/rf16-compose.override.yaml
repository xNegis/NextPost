# Disposable RF-16 verification only; combine with root docker-compose.yml and
# project name nextpost-rf16-review-20261016. Never target ordinary user volumes.
services:
  db:
    ports: !override
      - "127.0.0.1:15434:5432"
    environment:
      POSTGRES_DB: rf16_review
      POSTGRES_USER: rf16
      POSTGRES_PASSWORD: rf16-disposable-local
  backend:
    ports: !override
      - "127.0.0.1:18002:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://rf16:rf16-disposable-local@db:5432/rf16_review
      CORS_ORIGINS: http://localhost:14175
      SESSION_SECRET: rf16-disposable-local-session-secret
      PRIVATE_LINK_SECRET: rf16-disposable-local-private-link-secret
      PHOTO_STORAGE_ROOT: /app/data/photos
  frontend:
    ports: !override
      - "127.0.0.1:14175:80"
    build:
      args:
        VITE_API_BASE_URL: http://localhost:18002
