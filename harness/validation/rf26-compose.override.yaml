# Disposable RF-26 verification only; combine with root docker-compose.yml and
# project name nextpost-rf26-review-20261019. Never target ordinary user volumes.
services:
  db:
    ports: !override
      - "127.0.0.1:15436:5432"
    environment:
      POSTGRES_DB: rf26_review
      POSTGRES_USER: rf26
      POSTGRES_PASSWORD: rf26-disposable-local
  backend:
    ports: !override
      - "127.0.0.1:18004:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://rf26:rf26-disposable-local@db:5432/rf26_review
      CORS_ORIGINS: http://localhost:14177
      SESSION_SECRET: rf26-disposable-local-session-secret
      PRIVATE_LINK_SECRET: rf26-disposable-local-private-link-secret
      PHOTO_STORAGE_ROOT: /app/data/photos
  frontend:
    ports: !override
      - "127.0.0.1:14177:80"
    build:
      args:
        VITE_API_BASE_URL: http://localhost:18004
